name: Weekly Signal Scoring

on:
  schedule:
    # Runs every Sunday at 00:00 UTC (5:30 AM IST) to score historical signals
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  score_signals:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Signal Scorer
      run: python signal_scorer.py

    - name: Commit and Push Signal Scores
      run: |
        git config --global user.name "Portfolio Automation Bot"
        git config --global user.email "bot@github.com"
        git add reports/signal_scores.csv || true
        git diff-index --quiet HEAD || git commit -m "Automated Weekly Signal Scores Update: $(date +'%Y-%m-%d')"
        git push
